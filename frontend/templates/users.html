<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Users</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .user-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .user-header {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .user-info {
            margin-bottom: 10px;
            color: #555;
        }
        
        .label {
            font-weight: 600;
            color: #667eea;
        }
        
        .value {
            color: #333;
        }
        
        .birth-day-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .no-users {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            color: #666;
        }
        
        .btn-container {
            text-align: center;
        }
        
        .btn {
            padding: 12px 30px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👥 All Users</h1>
        
        {% if users %}
            <div class="users-grid">
                {% for user in users %}
                    <div class="user-card">
                        <div class="user-header">{{ user.first_name }} {{ user.last_name }}</div>
                        <div class="user-info">
                            <span class="label">DOB:</span>
                            <span class="value">{{ user.date_of_birth }}</span>
                        </div>
                        <div class="user-info">
                            <span class="label">Age:</span>
                            <span class="value">{{ user.age }} years old</span>
                        </div>
                        <div class="birth-day-badge">
                            Born on {{ user.birth_day }}
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="no-users">
                <h2>No users found</h2>
                <p>Add some users to see them here!</p>
            </div>
        {% endif %}
        
        <div class="btn-container">
            <a href="/" class="btn">Back to Home</a>
        </div>
    </div>
</body>
</html>
